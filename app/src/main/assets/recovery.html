<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171126"><title>Проверка сохранённых данных</title><style>body{background:#eee2f7;color:#171322;font:16px system-ui;margin:0;padding:28px 18px}h1{font-size:23px}p{line-height:1.5}button{display:block;width:100%;padding:15px;margin:16px 0;background:#fbf8ff;color:#171322;border:1px solid #b98ad9;border-radius:14px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fbf8ff;padding:14px;border-radius:12px;font:14px system-ui}small{display:block;line-height:1.5}button:disabled{opacity:.5}</style></head><body><h1>Проверка сохранённых данных</h1><p>Обычный ежедневник остановлен. Эта версия не сохраняет изменения в заметки, расписание и тренировки.</p><pre id="report">Читаю доступное хранилище…</pre><button id="json" disabled>Сохранить данные для проверки</button><button id="archive">Сохранить полный архив хранилища</button><small>Архив может быть большим. Он содержит личные данные приложения. Сохрани его в «Загрузки». Ничего автоматически не отправляется.</small><p id="status" role="status"></p><script>
'use strict';
let snapshot=null;
const report=document.getElementById('report'),status=document.getElementById('status');
async function scan(){
 const storage={},errors=[],databases=[];let notes=0,days=0,workouts=0;
 try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);storage[key]=localStorage.getItem(key)}}catch(e){errors.push('Чтение основных данных: '+e.message)}
 for(const [key,raw]of Object.entries(storage)){try{const item=JSON.parse(raw);if(!item||typeof item!=='object')continue;notes+=Array.isArray(item.notes)?item.notes.length:0;days+=new Set([...Object.keys(item.days||{}),...Object.keys(item.hourlyDays||{})]).size;if(item.workout)workouts++;}catch(e){}}
 let names=['dayplan-note-media'];try{if(indexedDB.databases)names=(await indexedDB.databases()).map(d=>d.name).filter(Boolean)}catch(e){errors.push('Список баз: '+e.message)}
 for(const name of names){try{databases.push(await new Promise((resolve,reject)=>{const req=indexedDB.open(name);req.onupgradeneeded=()=>req.transaction.abort();req.onerror=()=>reject(req.error);req.onsuccess=async()=>{const db=req.result,stores=[];try{for(const storeName of db.objectStoreNames){const rows=await new Promise((ok,no)=>{const tx=db.transaction(storeName,'readonly'),out=[];const cursor=tx.objectStore(storeName).openCursor();cursor.onsuccess=()=>{const c=cursor.result;if(c){const value=c.value,meta={key:c.key};if(value&&typeof value==='object')for(const [k,v]of Object.entries(value)){if(v instanceof Blob)meta[k]={blob:true,size:v.size,type:v.type};else if(v===null||['string','number','boolean'].includes(typeof v))meta[k]=v}out.push(meta);c.continue()}};tx.oncomplete=()=>ok(out);tx.onerror=tx.onabort=()=>no(tx.error)});stores.push({name:storeName,count:rows.length,rows})}resolve({name,stores})}catch(e){reject(e)}finally{db.close()}}}))}catch(e){errors.push(name+': '+e.message)}}
 snapshot={format:'planner-recovery-inspection-v1',created:new Date().toISOString(),storage,databases,errors};
 report.textContent='Доступных записей хранилища: '+Object.keys(storage).length+'\nЗаметок в доступных данных: '+notes+'\nДат расписания: '+days+'\nРазделов тренировок: '+workouts+'\n'+databases.flatMap(d=>d.stores.map(s=>'База '+d.name+' / '+s.name+': '+s.count+' записей')).join('\n')+(errors.length?'\nОшибки: '+errors.join('\n'):'')+'\n\nЭто проверка доступных записей, а не подтверждение восстановления. Полный архив нужен для поиска возможных остатков.';
 document.getElementById('json').disabled=false;
}
document.getElementById('json').onclick=()=>{if(!snapshot)return;const text=JSON.stringify(snapshot,null,2);if(window.AndroidFiles?.saveBackup){AndroidFiles.saveBackup('planner-inspection.json',text);status.textContent='Выбери папку и сохрани файл planner-inspection.json.'}else{const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='planner-inspection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}};
document.getElementById('archive').onclick=()=>{if(window.AndroidFiles?.saveRecoveryArchive){AndroidFiles.saveRecoveryArchive();status.textContent='После выбора места дождись сообщения «Архив сохранён». Не закрывай приложение до окончания.'}else status.textContent='Полный архив доступен в проверочном APK.'};
scan().catch(e=>{report.textContent='Проверка не завершилась: '+e.message});
document.documentElement.dataset.appReady='true';
</script></body></html>
