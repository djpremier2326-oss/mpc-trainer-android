plugins { id 'com.android.application' }
android {
    namespace 'com.bytbeat.dayplan'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bytbeat.dayplan'
        minSdk 26
        targetSdk 34
        versionCode 71
        versionName '2.3.49'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('planner-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

