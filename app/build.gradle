plugins { id 'com.android.application' }
def friendPlanner = project.hasProperty('friendPlanner')
android {
    namespace 'com.bytbeat.dayplan'
    compileSdk 36
    defaultConfig {
        applicationId friendPlanner ? 'com.bytbeat.dayplan.friend' : 'com.bytbeat.dayplan'
        buildConfigField 'boolean', 'FRIEND_SHIFT', friendPlanner ? 'true' : 'false'
        resValue 'string', 'app_name', 'Чёрные дела'
        manifestPlaceholders = [launcherIcon: '@mipmap/ic_black_deeds']
        minSdk 26
        targetSdk 34
        versionCode 107
        versionName '2.3.85'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile rootProject.file('planner-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    testImplementation 'junit:junit:4.13.2'
}

