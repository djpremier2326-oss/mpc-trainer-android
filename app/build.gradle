plugins { id 'com.android.application' }
def friendPlanner = project.hasProperty('friendPlanner')
android {
    namespace 'com.bytbeat.dayplan'
    compileSdk 35
    defaultConfig {
        applicationId friendPlanner ? 'com.bytbeat.dayplan.friend' : 'com.bytbeat.dayplan'
        buildConfigField 'boolean', 'FRIEND_SHIFT', friendPlanner ? 'true' : 'false'
        resValue 'string', 'app_name', friendPlanner ? 'Расписание смен' : 'Расписание'
        minSdk 26
        targetSdk 34
        versionCode 77
        versionName '2.3.55'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile rootProject.file('planner-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

