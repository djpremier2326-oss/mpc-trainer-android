plugins { id 'com.android.application' }
def friendPlanner = project.hasProperty('friendPlanner')
android {
    namespace 'com.bytbeat.dayplan'
    compileSdk 36
    defaultConfig {
        applicationId friendPlanner ? 'com.bytbeat.dayplan.friend' : 'com.bytbeat.dayplan'
        buildConfigField 'boolean', 'FRIEND_SHIFT', friendPlanner ? 'true' : 'false'
        resValue 'string', 'app_name', 'Чёрные дела'
        manifestPlaceholders = [launcherIcon: '@mipmap/ic_black_deeds']
        minSdk 26
        targetSdk 34
        versionCode 10088
        versionName '2.3.190'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile rootProject.file('planner-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}


// The same assets are used by local builds, tests and CI, including Notes media patches.
def plannerAssets=layout.buildDirectory.dir('generated/plannerAssets')
android.sourceSets.main.assets.setSrcDirs([plannerAssets])
def preparePlannerAssets=tasks.register('preparePlannerAssets',Exec){
    inputs.dir('src/main/assets')
    inputs.files(rootProject.fileTree('scripts'){include '*.py'})
    outputs.dir(plannerAssets)
    workingDir rootProject.projectDir
    commandLine 'python3',rootProject.file('scripts/prepare-assets.py'),plannerAssets.get().asFile
}
tasks.named('preBuild').configure{dependsOn preparePlannerAssets}
