name: Verify offline planner 2.3.172
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify offline images and backup controls
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          python3 scripts/prepare-assets.py
          node --test --test-name-pattern='header|artwork' scripts/ui.test.cjs
          node --test scripts/data-protection.test.cjs scripts/aurora.test.cjs scripts/indigo.test.cjs
      - name: Test Android and assemble the existing signed app
        run: |
          base64 --decode signing/planner-debug.keystore.b64 > planner-debug.keystore
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --refresh-dependencies --stacktrace; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          cp app/build/outputs/apk/release/app-release.apk raspisanie-2.3.172.apk
      - uses: actions/upload-artifact@v4
        with:
          name: offline-planner-2.3.172
          path: raspisanie-2.3.172.apk
