name: Build Shift Planner APK
on:
  push:
    branches: [friend-shift-calendar]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing
        run: base64 --decode signing/planner-debug.keystore.b64 > planner-debug.keystore
      - name: Test reminder timing
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk smeny-2-2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smeny-2-2-apk
          path: smeny-2-2.apk
          if-no-files-found: error
