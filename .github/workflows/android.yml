name: Build Calendar-first APK
on:
  push:
    branches: [calendar-first-planner]
  workflow_dispatch:
    inputs:
      startup_baseline_run:
        description: "Optional workflow run containing baseline raspisanie-apk for upgrade/startup comparison"
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check calendar source syntax
        run: |
          node --check app/src/main/assets/calendar-first/calendar.js
          node --check app/src/main/assets/calendar-first/home-v2.js
      - name: Restore stable debug signing
        run: base64 --decode signing/planner-debug.keystore.b64 > planner-debug.keystore
      - name: Register Rhythm theme
        run: python3 scripts/apply-rhythm-theme.py
      - name: Enable customizable main menu
        run: python3 scripts/apply-custom-main-menu.py
      - name: Update theme preview cards
        run: python3 scripts/apply-theme-preview-fixes.py
      - name: Register Violet Neon theme
        run: python3 scripts/apply-violet-theme.py
      - name: Enable Violet ranged timeline
        run: python3 scripts/apply-violet-timeline-v3.py
      - name: Fix Violet swipe gesture
        run: python3 scripts/apply-violet-swipe-gesture-fix.py
      - name: Standard mobile task swipe
        run: python3 scripts/apply-violet-standard-swipe.py
      - name: Default Violet new-task time to zero
        run: python3 scripts/apply-violet-zero-default-time.py
      - name: Restore Violet day tools and current-hour autoscroll
        run: python3 scripts/apply-violet-tools-autoscroll.py
      - name: Align Violet hour labels inside rows
        run: python3 scripts/apply-violet-axis-fix.py
      - name: Compact Violet timeline blocks
        run: python3 scripts/apply-violet-timeline-sizing-fix.py
      - name: Add Violet automatic task icons
        run: python3 scripts/apply-violet-task-icons.py
      - name: Enable editable saved task and day colors
        run: python3 scripts/apply-custom-colors.py
      - name: Fix walk and exercise task icon
        run: python3 scripts/apply-violet-walk-icon.py
      - name: Unify day screen across themes
        run: python3 scripts/apply-unified-day-all-themes.py
      - name: Increase wishes video limit
        run: python3 scripts/apply-wishes-video-limit.py
      - name: Rename wishes to favorites
        run: python3 scripts/apply-favorites-renaming.py
      - name: Normalize reminder bell colors
        run: python3 scripts/apply-reminder-bell-fix.py
      - name: Disable automatic day switching
        run: python3 scripts/remove-auto-day-switch.py
      - name: Attach calendar-first interface
        run: python3 scripts/apply-calendar-first.py
      - name: Test reminder timing
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk raspisanie.apk
      - uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: raspisanie.apk
          if-no-files-found: error
      - name: Build friend shift schedule APK
        run: gradle :app:assembleRelease -PfriendPlanner=true --stacktrace
      - name: Name friend APK
        run: cp app/build/outputs/apk/release/app-release.apk raspisanie-drug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: raspisanie-drug-apk
          path: raspisanie-drug.apk
          if-no-files-found: error
  startup-check:
    if: github.event_name == 'workflow_dispatch' && inputs.startup_baseline_run != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raspisanie-apk
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: raspisanie-apk
          run-id: ${{ inputs.startup_baseline_run }}
          github-token: ${{ github.token }}
          path: baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot verifier
        run: python3 -m pip install Pillow websocket-client
      - name: Compare cold launches and hot resumes on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-build: 13025442
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: python3 scripts/startup-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-evidence
          path: startup-evidence/

  renderer-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raspisanie-apk
          path: candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: python3 scripts/renderer-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence
          path: renderer-evidence/
