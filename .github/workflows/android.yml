name: Build Android APK

on:
  push:
    branches:
      - main
      - browser-integration
      - phone-ui-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Integrate streaming Browser preview
        run: python3 scripts/integrate_browser_preview.py
      - name: Integrate trainer UI state
        run: python3 scripts/integrate_ui_state.py
      - name: Test trainer core
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mpc-trainer-retro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
