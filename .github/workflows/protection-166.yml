name: Verify data protection 2.3.166
on:
  push:
    branches: [data-protection-166]
    paths-ignore: ['.github/workflows/publish-166.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify browser persistence and privacy
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          npm test
      - name: Restore existing app signing
        run: base64 --decode signing/planner-debug.keystore.b64 > planner-debug.keystore
      - name: Verify Android persistence, encryption and release
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk black-deeds-2.3.166.apk
      - uses: actions/upload-artifact@v4
        with:
          name: black-deeds-2.3.166-apk
          path: black-deeds-2.3.166.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-protection-check-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
